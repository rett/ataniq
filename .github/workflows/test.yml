# Runs the project's whole test suite on pull requests and on pushes to develop:
# the job test is make test, the job test-canary is the tests of the code behind
# the canary build tag, and the job test-ownerchannel is the tests of the code
# behind the owner channel's build tag, alone and with the canary tag. None
# builds a release artifact or uploads one.
name: test

on:
  pull_request:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: make -n bootstrap
      - run: make bootstrap
      - run: make doctor
      - run: make test
      - name: changelog fragments are folded
        if: startsWith(github.head_ref || github.ref_name, 'release/') || startsWith(github.head_ref || github.ref_name, 'hotfix/')
        run: make changelog-check
  test-canary:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: make -n bootstrap
      - run: make bootstrap
      - run: make doctor
      - run: make test-canary
  test-ownerchannel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
      - run: make -n bootstrap
      - run: make bootstrap
      - run: make doctor
      - run: make test-ownerchannel
