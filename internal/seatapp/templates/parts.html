{{define "standin"}}<p class="banner" role="note"><strong>STAND-IN</strong> Scratch only: the desk runs a stand-in door on scratch state. Nothing here is a real approval.</p>{{end}}
{{define "readonly"}}<p class="readonly">Approve or deny on the card's own page, or at the desk.</p>{{end}}
{{define "leave"}}<footer class="leave">
<p><button id="logout" type="button" class="quiet" hidden>Log out</button></p>
<p id="logout-status" role="status"></p>
</footer>
<script src="/static/session.js"></script>{{end}}

{{define "watch"}}<p id="watch-status" role="status" aria-live="polite"></p>
<div id="watch" data-live="{{if .Live}}yes{{else}}no{{end}}" data-version="{{.Version}}"{{if .Card}} data-card="{{.Card}}" data-binding="{{.Binding}}"{{else if .Still}} data-still="yes"{{end}}></div>
<script src="/static/watch.js"></script>{{end}}
